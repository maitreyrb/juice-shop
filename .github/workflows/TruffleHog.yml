name: TruffleHog Secret Scan

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  trufflehog-scan:
    name: TruffleHog Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --results=verified,unknown \
            --fail

      - name: Scan Completed
        if: success()
        run: echo "No secrets detected by TruffleHog."
