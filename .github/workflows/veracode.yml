name: Veracode Security Scans

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '11 0 * * 0'

jobs:
  # ---------------------------------------------------------------
  # Job 1: Veracode Pipeline Scan (SAST) - fast CI/CD feedback
  # ---------------------------------------------------------------
  veracode-pipeline-scan:
    name: Veracode SAST (Pipeline Scan)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package application for scanning
        run: |
          zip -r veracode-scan-target.zip ./ \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "test/*" \
            -x "tests/*" \
            -x "*.zip" \
            -x "frontend/node_modules/*" \
            -x "build/*" \
            -x "dist/*" \
            -x "coverage/*"
          ls -lh veracode-scan-target.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Veracode Pipeline Scan CLI
        run: |
          curl --silent --show-error --fail -O \
            https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip

      # Retry ONLY on infrastructure failures (no results.json produced).
      # If scan completes (results.json exists), respect its exit code -
      # whether 0 (clean), 8 (8 findings), or any other count.
      - name: Run Veracode Pipeline Scan (fails on High / Very High)
        run: |
          set +e
          rm -f results.json filtered_results.json
          final_rc=1

          for attempt in 1 2 3; do
            echo "=== Pipeline Scan attempt $attempt ==="
            rm -f results.json filtered_results.json

            java -jar pipeline-scan.jar \
              --veracode_api_id "${{ secrets.VERACODE_API_ID }}" \
              --veracode_api_key "${{ secrets.VERACODE_API_KEY }}" \
              --fail_on_severity="Very High, High" \
              --project_name "${{ github.repository }}" \
              --project_url "${{ github.server_url }}/${{ github.repository }}" \
              --project_ref "${{ github.ref_name }}" \
              --issue_details true \
              --file veracode-scan-target.zip
            rc=$?

            # Did the scan actually produce results?
            if [ -f results.json ]; then
              echo "Scan completed (exit $rc). Results produced."
              final_rc=$rc
              break
            fi

            echo "No results.json produced (exit $rc). Treating as transient infra failure."
            if [ $attempt -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done

          # final_rc:
          #   0  = no findings at/above threshold -> PASS
          #   >0 = N findings at/above threshold  -> FAIL the gate
          echo "Final exit code: $final_rc"
          exit $final_rc

      - name: Convert pipeline scan results to SARIF
        if: always() && hashFiles('results.json') != ''
        uses: veracode/veracode-pipeline-scan-results-to-sarif@v1.0.6
        with:
          pipeline-results-json: results.json

      - name: Upload SARIF results to GitHub Security
        if: always() && hashFiles('veracode-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veracode-results.sarif
          category: veracode-sast

  # ---------------------------------------------------------------
  # Job 2: Veracode SCA (SourceClear)
  # ---------------------------------------------------------------
  # CVSS-based failure thresholds are configured in the Veracode Platform
  # under SCA Agent -> Workspaces -> Rules.
  veracode-sca-scan:
    name: Veracode SCA (SourceClear)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Veracode SCA agent
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        uses: veracode/veracode-sca@v2.1.9
        with:
          quick: false
          create-issues: false
          allow-dirty: true

  # ---------------------------------------------------------------
  # Job 3 (OPTIONAL): Veracode Policy Scan - publishes to platform
  # ---------------------------------------------------------------
  # Runs only on schedule (weekly) since it's slow (~hours).
  # This is what makes your app appear in the Veracode Platform UI
  # with full policy enforcement and historical tracking.
