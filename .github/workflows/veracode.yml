name: Veracode Security Scans

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '11 0 * * 0'

jobs:
  # ---------------------------------------------------------------
  # Job 1: Veracode Pipeline Scan (SAST)
  # ---------------------------------------------------------------
  veracode-pipeline-scan:
    name: Veracode SAST (Pipeline Scan)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Package only what's needed for SAST.
      # Excluding node_modules, .git, tests, etc. keeps upload small
      # and avoids HTTP 524 timeouts on Veracode's upload endpoint.
      - name: Package application for scanning
        run: |
          zip -r veracode-scan-target.zip ./ \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "test/*" \
            -x "tests/*" \
            -x "*.zip" \
            -x "frontend/node_modules/*" \
            -x "build/*" \
            -x "dist/*" \
            -x "coverage/*"
          ls -lh veracode-scan-target.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Veracode Pipeline Scan CLI
        run: |
          curl --silent --show-error --fail -O \
            https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip

      # Retry up to 3 times on transient upload failures (HTTP 5xx).
      # --fail_on_severity makes it exit non-zero on High / Very High findings.
      - name: Run Veracode Pipeline Scan (fails on High / Very High)
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "=== Pipeline Scan attempt $attempt ==="
            java -jar pipeline-scan.jar \
              --veracode_api_id "${{ secrets.VERACODE_API_ID }}" \
              --veracode_api_key "${{ secrets.VERACODE_API_KEY }}" \
              --fail_on_severity="Very High, High" \
              --file veracode-scan-target.zip
            rc=$?
            # Exit codes: 0 = clean, 1 = findings at/above threshold (gate works),
            # anything else = infrastructure / upload error -> retry.
            if [ $rc -eq 0 ] || [ $rc -eq 1 ]; then
              exit $rc
            fi
            echo "Transient failure (exit $rc). Retrying in 30s..."
            sleep 30
          done
          echo "Pipeline Scan failed after 3 attempts."
          exit 1

      - name: Convert pipeline scan results to SARIF
        if: always() && hashFiles('results.json') != ''
        uses: veracode/veracode-pipeline-scan-results-to-sarif@v1.0.6
        with:
          pipeline-results-json: results.json

      - name: Upload SARIF results to GitHub Security
        if: always() && hashFiles('veracode-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veracode-results.sarif
          category: veracode-sast

  # ---------------------------------------------------------------
  # Job 2: Veracode SCA (SourceClear)
  # ---------------------------------------------------------------
  # Note: CVSS-based failure thresholds for SCA are configured in the
  # Veracode Platform under SCA Agent -> Workspaces -> Rules, NOT here.
  # Set the rule "Fail build if vuln CVSS >= 7.0" in the workspace,
  # and this job will exit non-zero accordingly.
  veracode-sca-scan:
    name: Veracode SCA (SourceClear)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Veracode SCA agent
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        uses: veracode/veracode-sca@v2.1.9
        with:
          quick: false
          create-issues: false
          allow-dirty: true
