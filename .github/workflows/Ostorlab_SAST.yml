name: Ostorlab Web Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ostorlab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ostorlab-web-scan:
    name: Scan UAT with Ostorlab
    runs-on: ubuntu-latest

    # Repository secrets are not provided to workflows from forked PRs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Launch Ostorlab web scan
        id: ostorlab
        uses: Ostorlab/ostorlab_actions@v2.1.0
        with:
          scan_profile: full_web_scan
          asset_type: link --url
          target: https://uat.riyadhair.io/en-ie/home
          scan_title: GitHub CI - ${{ github.repository }} - ${{ github.sha }}
          ostorlab_api_key: ${{ secrets.TEST_INTEGRATION }}

          # During initial validation, this waits for the result and
          # fails only if the final rating is above HIGH, meaning CRITICAL.
          break_on_risk_rating: HIGH
          max_wait_minutes: 60

      - name: Publish scan summary
        if: always() && steps.ostorlab.outputs.scan_id != ''
        env:
          SCAN_ID: ${{ steps.ostorlab.outputs.scan_id }}
        run: |
          {
            echo "## Ostorlab web security scan"
            echo ""
            echo "- Target: https://uat.riyadhair.io/en-ie/home"
            echo "- Scan ID: ${SCAN_ID}"
            echo "- Report: https://report.ostorlab.co/scan/${SCAN_ID}/"
          } >> "$GITHUB_STEP_SUMMARY"
